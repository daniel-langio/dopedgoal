name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release build in flight: it tags and pushes, and a half-finished
# run is worse than a slow one.
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build and release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
        with:
          # versionCode is the commit count, and the default shallow clone would
          # report 1. Without this the APK never becomes installable over the
          # previous one.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Gate the release on the same checks CI runs, so a broken commit can never
      # be tagged.

      - name: Compute version
        id: version
        env:
          # The commit message is passed through the environment rather than
          # interpolated as ${{ }} directly into the script below. A GitHub
          # expression is pasted in as raw text *before* bash parses the script,
          # so backticks, $( ) or an unbalanced quote in a commit message would
          # execute or break the build. Via env, bash treats the value as inert.
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # Strictly monotonic without anyone maintaining a counter.
          version_code="$(git rev-list --count HEAD)"

          current="$(sed -n 's/^versionName=//p' version.properties | tr -d '[:space:]')"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.properties has a malformed versionName: '$current'"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$current"

          # Conventional commits decide the increment. Only the subject line is
          # considered for the type; a BREAKING CHANGE footer may appear anywhere.
          subject="${COMMIT_MESSAGE%%$'\n'*}"

          if printf '%s\n' "$COMMIT_MESSAGE" | grep -qE '^BREAKING CHANGE:' \
            || printf '%s' "$subject" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            major=$((major + 1)); minor=0; patch=0; bump=major
          elif printf '%s' "$subject" | grep -qE '^feat(\([^)]*\))?:'; then
            minor=$((minor + 1)); patch=0; bump=minor
          else
            patch=$((patch + 1)); bump=patch
          fi

          version_name="${major}.${minor}.${patch}"
          apk_name="DopedGoal-${version_name}-${version_code}.apk"

          {
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
            echo "apk_name=${apk_name}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### ${apk_name}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`${current}\` → \`${version_name}\` (${bump}) |"
            echo "| versionCode | \`${version_code}\` (commit count) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Decode release keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "::notice::No release keystore configured. The APK will be signed with the debug key: installable for testing, not distributable."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "path=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          # Absent when the keystore secrets are not configured, in which case
          # the build falls back to the debug key.
          DOPEDGOAL_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          DOPEDGOAL_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          DOPEDGOAL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          DOPEDGOAL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease \
            -PappVersionName="$APP_VERSION_NAME" \
            -PappVersionCode="$APP_VERSION_CODE"

      - name: Name the APK
        id: apk
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          built="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [[ -z "$built" ]]; then
            echo "::error::no APK was produced"
            exit 1
          fi
          mkdir -p artifacts
          cp "$built" "artifacts/${APK_NAME}"
          echo "path=artifacts/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Last, and only for real pushes: the bump is persisted only once a
      # buildable, tested APK actually exists.
      - name: Tag and publish GitHub release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Keep the explanatory header, replace only the value.
          sed -i "s/^versionName=.*/versionName=${VERSION_NAME}/" version.properties

          git add version.properties
          # [skip ci] is load-bearing. Without it this push re-triggers this
          # workflow, which bumps the version again, forever.
          git commit -m "chore(release): v${VERSION_NAME} [skip ci]"
          git tag -a "v${VERSION_NAME}" -m "v${VERSION_NAME}"

          # A human push can land while this build runs (the concurrency group
          # only serialises this workflow against itself). Rebasing the bump
          # commit onto it is safe: this commit touches version.properties alone.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "v${VERSION_NAME}"

          gh release create "v${VERSION_NAME}" "$APK_PATH" \
            --title "v${VERSION_NAME}" \
            --generate-notes
