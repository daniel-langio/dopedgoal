name: Flutter Build APK

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-build-apk.yml'
  pull_request:
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-build-apk.yml'
  workflow_dispatch:

# A push-triggered run persists the version bump at the end; don't cut it off
# mid-flight the way a plain CI job could be.
concurrency:
  group: flutter-build-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Analyze, test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flutter

    steps:
      - uses: actions/checkout@v7
        with:
          # The build number is the commit count, and the default shallow
          # clone would report 1.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compute version
        id: version
        run: |
          set -euo pipefail

          # Strictly monotonic without anyone maintaining a counter.
          build_number="$(git rev-list --count HEAD)"

          major="$(sed -n 's/^versionMajor=//p' version.properties | tr -d '[:space:]')"
          minor="$(sed -n 's/^versionMinor=//p' version.properties | tr -d '[:space:]')"
          if [[ ! "$major" =~ ^[0-9]+$ || ! "$minor" =~ ^[0-9]+$ ]]; then
            echo "::error::version.properties has a malformed versionMajor/versionMinor: '$major'/'$minor'"
            exit 1
          fi

          # Minor bumps once per push to main. A PR or manual run builds with
          # the currently persisted version instead, so it never races the
          # bump a concurrent push-triggered run is about to commit.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            next_minor=$((minor + 1))
          else
            next_minor="$minor"
          fi

          version_name="${major}.${next_minor}"
          apk_name="DopedGoal-Flutter-${version_name}+${build_number}.apk"

          {
            echo "major=${major}"
            echo "next_minor=${next_minor}"
            echo "version_name=${version_name}"
            echo "build_number=${build_number}"
            echo "apk_name=${apk_name}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### ${apk_name}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| versionName | \`${major}.${minor}\` → \`${version_name}\` |"
            echo "| versionCode (build number) | \`${build_number}\` (commit count) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # Debug-signed: installable for testing, not distributable. No release
      # keystore/signing story exists for this app yet.
      - name: Build debug APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --build-name="$VERSION_NAME" \
            --build-number="$BUILD_NUMBER"

      - name: Name the APK
        id: apk
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          built="build/app/outputs/flutter-apk/app-debug.apk"
          if [[ ! -f "$built" ]]; then
            echo "::error::no APK was produced"
            exit 1
          fi
          mkdir -p artifacts
          cp "$built" "artifacts/${APK_NAME}"
          echo "path=flutter/artifacts/${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.apk_name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # Last, and only for real pushes: the bump is persisted only once a
      # buildable, tested APK actually exists.
      - name: Persist minor version bump
        if: ${{ github.event_name == 'push' }}
        env:
          MAJOR: ${{ steps.version.outputs.major }}
          NEXT_MINOR: ${{ steps.version.outputs.next_minor }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          sed -i "s/^versionMinor=.*/versionMinor=${NEXT_MINOR}/" version.properties

          git add version.properties
          # [skip ci] is load-bearing. Without it this push re-triggers this
          # workflow, which bumps the version again, forever.
          git commit -m "chore(flutter): bump version to v${MAJOR}.${NEXT_MINOR} [skip ci]"

          # A human push can land while this build runs. Rebasing the bump
          # commit onto it is safe: this commit touches version.properties alone.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
