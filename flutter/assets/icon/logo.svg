<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect x="0" y="0" width="512" height="512" fill="#3b2f22"/>

  <!-- 2x2 grid of brick material swatches, centered -->
  <g stroke="rgba(0,0,0,.35)" stroke-width="1.6">

    <!-- Top-left: hairline cracks + moss squiggle -->
    <g>
      <rect x="52" y="164" width="200" height="88" rx="4" fill="#d8d3c9"/>
      <g stroke="#8f887a" stroke-width="1.1" fill="none" opacity=".55">
        <path d="M70 178 L96 190 L118 182"/>
        <path d="M150 172 L168 196 L160 214"/>
        <path d="M205 180 L228 172"/>
        <path d="M96 230 L112 214 L104 200"/>
      </g>
      <path d="M78 224 q9 -14 18 0 q9 -14 18 0 q9 -14 18 0 q9 -14 18 0"
            stroke="#4caf6b" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Top-right: hairline cracks + green paint wedge -->
    <g>
      <rect x="260" y="164" width="200" height="88" rx="4" fill="#d8d3c9"/>
      <clipPath id="wedgeClip"><rect x="260" y="164" width="200" height="88" rx="4"/></clipPath>
      <g clip-path="url(#wedgeClip)">
        <polygon points="330,164 460,164 460,252 380,252" fill="#5c8a5c"/>
        <circle cx="410" cy="185" r="2.6" fill="#9dcf9d" opacity=".8"/>
        <circle cx="435" cy="200" r="1.8" fill="#9dcf9d" opacity=".7"/>
        <circle cx="400" cy="215" r="2.2" fill="#8fbf8f" opacity=".75"/>
        <circle cx="445" cy="230" r="2.8" fill="#9dcf9d" opacity=".65"/>
        <circle cx="420" cy="240" r="1.6" fill="#b6e0b6" opacity=".8"/>
        <circle cx="452" cy="178" r="1.6" fill="#b6e0b6" opacity=".7"/>
      </g>
      <g stroke="#8f887a" stroke-width="1.1" fill="none" opacity=".55">
        <path d="M278 182 L296 198 L288 214"/>
        <path d="M270 230 L286 220"/>
      </g>
    </g>

    <!-- Bottom-left: speckle + indigo drips -->
    <g>
      <rect x="52" y="260" width="200" height="88" rx="4" fill="#948a7c"/>
      <g fill="#c9c2b5" opacity=".5">
        <circle cx="72" cy="278" r="1.6"/>
        <circle cx="95" cy="300" r="2.1"/>
        <circle cx="130" cy="285" r="1.4"/>
        <circle cx="160" cy="310" r="1.9"/>
        <circle cx="200" cy="292" r="1.6"/>
        <circle cx="225" cy="322" r="2.2"/>
        <circle cx="110" cy="325" r="1.3"/>
        <circle cx="80" cy="315" r="1.7"/>
      </g>
      <g fill="#33356e">
        <path d="M92 260 L104 260 L100 300 q-2 8 -6 8 q-4 0 -6 -8 Z"/>
        <path d="M150 260 L160 260 L157 316 q-1.5 7 -5 7 q-3.5 0 -5 -7 Z"/>
        <path d="M195 260 L203 260 L201 288 q-1 6 -4 6 q-3 0 -4 -6 Z"/>
      </g>
    </g>

    <!-- Bottom-right: speckle + white paint stripe -->
    <g>
      <rect x="260" y="260" width="200" height="88" rx="4" fill="#c17b70"/>
      <clipPath id="stripeClip"><rect x="260" y="260" width="200" height="88" rx="4"/></clipPath>
      <g clip-path="url(#stripeClip)">
        <g fill="#f2e6df" opacity=".55">
          <circle cx="280" cy="278" r="1.8"/>
          <circle cx="300" cy="322" r="2.3"/>
          <circle cx="330" cy="270" r="1.5"/>
          <circle cx="400" cy="290" r="2"/>
          <circle cx="430" cy="315" r="1.7"/>
          <circle cx="445" cy="275" r="2.2"/>
          <circle cx="370" cy="330" r="1.4"/>
        </g>
        <polygon points="270,340 310,258 340,258 300,340" fill="#f7f1ec" opacity=".9"/>
      </g>
    </g>

  </g>
</svg>
