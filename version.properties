# The app's semantic version.
#
# CI bumps this on every push to main, choosing the increment from the
# conventional-commit type of the pushed commit, and commits the result as
# `chore(release): vX.Y.Z [skip ci]`.
#
# versionCode is deliberately NOT stored here. It is the repository's commit
# count, computed at build time, so it auto-increments and stays strictly
# monotonic without anyone maintaining a counter.
versionName=0.3.4
